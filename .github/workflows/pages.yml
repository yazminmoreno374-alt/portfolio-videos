name: Build and publish portfolio videos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'index.html'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install download and video tools
        run: |
          python -m pip install --quiet gdown
          ffmpeg -version | head -n 1
      - name: Download publicly shared source videos and optimize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/videos/marcas site/videos/benito-fragmentos
          cp index.html site/index.html
          fetch() {
            local id="$1" target="$2"
            local temp
            temp="$(mktemp --suffix=.mp4)"
            if ! gdown --id "$id" -O "$temp" --quiet; then
              echo "::warning::Could not download $target; leaving it unpublished"
              rm -f "$temp"
              return 0
            fi
            if ! ffmpeg -nostdin -hide_banner -loglevel error -y -i "$temp" -map 0:v:0 -map '0:a:0?' -c:v libx264 -preset veryfast -crf 28 -vf "scale='min(1280,iw)':-2" -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart "$target"; then
              echo "::warning::Could not transcode $target"
              rm -f "$target"
            fi
            rm -f "$temp"
          }
          mkdir -p site/videos/otros
          fetch 1IxBoIVdiA5Ns9uySned17mqcvsUQ1G7Q site/videos/otros/sep28-a.mp4
          fetch 1NGWrrx4wcs21u83eESP4q4_-y3ZqD6w- site/videos/otros/sep30.mp4
          fetch 1xVue_TxZ1YHXMNibc3I37yPbTPL4ypO0 site/videos/otros/sep28-b.mp4
          fetch 1PhouweDPdOBSDHGoWVJPDQ5FTZezZvjj site/videos/otros/oct16.mp4
          fetch 1vwZ5cudU7rPRX1LXBPdVo1LZsgN_RMix site/videos/marcas/minsis.mp4
          fetch 1NSVQOAdZBtTL2Qjb-l_lOaQIHc9rLjhQ site/videos/marcas/zaru.mp4
          fetch 1U7oDG8iPb6dGdsKsi5FVAa0RPQ4qDGDg site/videos/marcas/smarketing.mp4
          fetch 1aCt90Z5WIPtY2DiBWs3essgODzgwXMa- site/videos/marcas/casita.mp4
          fetch 19Wy0dyV2yVSzhMTD3svLVIC7k2m7vuFJ site/videos/benito-fragmentos/mexico.mp4
          fetch 17_oiQzEXxhAE45vufIw5IrTeEf7v1C8S site/videos/benito-fragmentos/ia.mp4
          fetch 1cYIEP-AVYMvv_WaLlsQU_cqCL9F4dyUd site/videos/benito-fragmentos/bolivia.mp4
          fetch 1kJ-0gWMhBy9HAXxQs6m898a9g49sAF7T site/videos/benito-fragmentos/viral.mp4
          fetch 1kzco9PTns8T0lVifjnIPT0wDOrZq1-oD site/videos/benito-fragmentos/ormuz.mp4
          find site -type f -printf '%p %k KB\n'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
